# This is the name of the workflow. It will appear in the GitHub Actions tab.
name: Quantitative Trading Pipeline

# This section defines when the workflow will run.
on:
  # Triggers the workflow on pushes to the main branch.  Best practice: Use main, not master.
  push:
    branches: [ main ]
  # Allows you to manually run the workflow from the GitHub Actions UI.
  workflow_dispatch:

# A workflow run is made up of one or more jobs.
jobs:
  # This is the name of the job.
  build:
    # Specifies the type of machine to run the job on.  Use a specific version.
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      # Checks out the repository code to the runner.  Use actions/checkout@v4.
      - uses: actions/checkout@v4
        # Configures the checkout action.
        with:
          fetch-depth: 0 # Needed for some git commands like calculating changes

      # Sets up Python.  Use a specific version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs the project dependencies.  Use pip and requirements.txt.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Runs the tests.  Good practice to specify the working directory.
      - name: Run Tests
        run: pytest ./src/test/python/
        working-directory: ./

      # Lint the code (check for style issues).  Use a tool like flake8.
      - name: Lint Code
        run: flake8 ./src/main/python/
        working-directory: ./

      # Build a Docker image (if you plan to deploy with Docker).
      - name: Build Docker Image
        if: ${{ false }} # Disabled for now, remove 'if' to enable
        run: |
          docker build -t trading-app:latest .
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          docker push trading-app:latest
        working-directory: ./
        # Optional: Deploy to a cloud service (e.g., AWS, GCP, Azure).